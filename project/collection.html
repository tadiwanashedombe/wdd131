<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="alternate icon" href="images/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Distressed&display=swap" rel="stylesheet">

    <title>TheGaLLeRY</title>

    <meta name="description" content="This is the home page with all the photos and collections">
    <meta name="author" content="Tadiwanashe Dombe">

    <link rel="stylesheet" href="styles/index-large.css">
    <link rel="stylesheet" href="styles/index-medium.css">
    <link rel="stylesheet" href="styles/index.css">

    <script src="scripts/index.js" defer></script>
</head>

<body>
    <header>
        <div class="logo-group">
            <img src="images/logo.svg" alt="TheGaLLeRY logo" id="logo-image">
            <h1>TheGaLLeRY</h1>
        </div>
        <button id="menu" aria-label="Toggle navigation menu"></button>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="collection.html" class="active">Collections</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="manage.html">Manage</a></li>
            </ul>
        </nav>
        <div class="mobile-menu">
            <a href="index.html">
                <span>
                    <img src="images/home.svg" alt="home icon" width="24" height="24">
                    <p>Home</p>
                </span>
            </a>

            <a href="collection.html">
                <span class="active">
                    <img src="images/collection2.svg" alt="collections icon" width="24" height="24">
                    <p>Collections</p>
                </span>
            </a>

            <a href="gallery.html">
                <span>
                    <img src="images/gallery.svg" alt="gallery icon" width="24" height="24">
                    <p>Gallery</p>
                </span>
            </a>

            <a href="manage.html">
                <span>
                    <img src="images/manage.svg" alt="manage icon" width="24" height="24">
                    <p>Manage</p>
                </span>
            </a>
        </div>
    </header>
    <main>
        <div class="collections">
            <div class="collection-header">
                <h2>TheCollections</h2>
                <button class="add-collection" title="Create Collection"></button>
            </div>

            <div class="create-container">
                <form action="#" id="collectionForm" class="colection-form">
                    <div class="form-group">
                        <label for="collectionName">Collection Name</label>
                        <input type="text" id="collectionName" required placeholder="My collection">
                    </div>

                    <div class="image-picker">
                        <p>Select photos to include:</p>
                        <div class="image-grid" id="imageGrid">

                            <!-- images -->

                        </div>
                    </div>
                    <div class="selected-info">
                        <span id="selectedCount">0</span> photos selected
                    </div>
                    <button type="submit" id="createCollectionBtn">Create Collection</button>
                </form>
            </div>
            <div class="collections-container">

            </div>
        </div>
    </main>

    <footer>
        <p>©️<span id="year"></span> - TheGaLLeRY</p>
    </footer>
</body>

</html>
